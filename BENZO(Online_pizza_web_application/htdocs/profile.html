
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Pizza Profile</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <div class="container">

    <h1>👤 My Pizza Creations</h1>


    <!--USER PROFILE INFORMATION -->

    <div id="userInfoSection" class="user-info-section">

      <div class="user-info-item">
        <i class="fas fa-user"></i>
        <div>
          <span class="user-info-label">Name</span>
          <strong id="profileUserName">Loading...</strong>
        </div>
      </div>

      <div class="user-info-item">
        <i class="fas fa-envelope"></i>
        <div>
          <span class="user-info-label">Email</span>
          <strong id="profileUserEmail">Loading...</strong>
        </div>
      </div>

      <div class="user-info-item">
        <i class="fas fa-clock"></i>
        <div>
          <span class="user-info-label">Last Login</span>
          <strong id="profileLastLogin">Loading...</strong>
        </div>
      </div>

      <div class="user-info-item">
        <i class="fas fa-pizza-slice"></i>
        <div>
          <span class="user-info-label">Saved Pizzas</span>
          <strong id="profilePizzaCount">0</strong>
        </div>
      </div>

    </div>


    <!--SELECTION MODE -->

    <div id="selectionModeUI" style="display: none;">

      <div class="selection-mode-indicator">
        <i class="fas fa-check-circle"></i>
        Selection Mode - Select multiple pizzas to share
      </div>

      <div class="selection-actions">

        <button class="selection-btn primary" id="shareSelectedBtn">
          <i class="fas fa-share-alt"></i>
          Share Selected Pizzas
        </button>

        <button class="selection-btn secondary" id="cancelSelectionBtn">
          <i class="fas fa-times"></i>
          Cancel
        </button>

      </div>

    </div>


    <!--VIEW ONLY MODE -->

    <div id="viewOnlyIndicator" class="view-only-indicator" style="display: none;">

      <i class="fas fa-eye"></i>
      View Only Mode - You can view but not modify these pizzas

    </div>


    <!--PROFILE SECTION -->

    <div class="profile-section">

      <div class="pizzas-grid" id="userPizzasGrid">
        <!-- User's pizzas will be loaded from database -->
      </div>


      <!--Share Multiple Button-->

      <div id="shareMultipleBtnContainer"
           style="text-align: center; margin-top: 20px;">

        <button class="selection-btn primary" id="shareMultipleBtn">

          <i class="fas fa-share-alt"></i>
          Share Multiple Pizzas

        </button>

      </div>

    </div>

  </div>

  <div id="modalsRoot"></div>


  <script src="api.js"></script>
  <script src="profile.js"></script>

</body>
</html>
